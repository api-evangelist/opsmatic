name: opsmatic
description: Opsmatic was a San Francisco-based infrastructure monitoring startup founded in 2013
  that delivered a cloud service for real-time visibility into configuration changes and configuration
  "drift" across dynamic cloud infrastructure, alerting DevOps and operations teams so they could
  troubleshoot and reduce downtime. New Relic acquired Opsmatic in November 2015 to enter the
  infrastructure monitoring market, and the company no longer operates as an independent entity. The
  opsmatic.com domain now redirects to newrelic.com and there is no live independent developer portal,
  documentation, or API surface to enrich. This record is retained as a historical VC-portfolio profile.
